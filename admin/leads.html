<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads | Mistletoe CRM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../images/logo-badge.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b3d26">
<meta name="apple-mobile-web-app-title" content="Mistletoe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=3">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="app">
<div class="app-shell">
  <aside class="app-side">
    <a class="brand" href="index.html"><img src="../images/logo-lockup-white.png" alt="Mistletoe Construction"></a>
    <nav class="app-nav" aria-label="CRM">
      <a href="index.html">Dashboard</a>
      <a href="leads.html" aria-current="page">Leads</a>
      <a href="customers.html">Customers</a>
      <a href="jobs.html">Jobs</a>
      <a href="schedule.html">Schedule</a>
      <a href="members.html">Members</a>
      <a href="money.html">Money</a>
      <a href="partners.html">Partners</a>
      <a href="proposals.html">Proposals</a>
      <a href="team.html">Team</a>
      <a href="../index.html" class="nav-sep">← View site</a>
      <a href="#" id="logout">Log out</a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Leads</h1>
        <p class="sub">Drag cards between stages. Won leads become customers.</p>
      </div>
      <button class="btn btn-primary btn-sm" id="add-lead">+ New Lead</button>
    </div>

    <div class="kanban" id="board"></div>
  </main>
</div>

<div class="modal-back" id="lead-modal">
  <div class="modal">
    <h3>New Lead</h3>
    <div class="form-row">
      <div><label for="nl-name">Name *</label><input id="nl-name" required></div>
      <div><label for="nl-phone">Phone</label><input id="nl-phone" type="tel"></div>
    </div>
    <div class="form-row">
      <div><label for="nl-city">Town</label>
        <select id="nl-city"><option>Roseburg</option><option>Riddle</option><option>Myrtle Creek</option><option>Winston</option><option>Sutherlin</option><option>Canyonville</option><option>Green</option><option>Oakland</option><option>Glide</option><option>Camas Valley</option><option>Other</option></select>
      </div>
      <div><label for="nl-service">Service</label>
        <select id="nl-service"><option>Roof Replacement</option><option>Roof Repair</option><option>Moss Removal</option><option>Metal Roofing</option><option>Siding</option><option>Gutter Cleaning</option><option>Gutter Guards</option><option>Decks</option><option>Fences</option><option>Flooring</option><option>Landscaping</option><option>Pool Installation</option><option>General Contracting</option><option>Membership</option></select>
      </div>
    </div>
    <div style="margin-bottom:0.4rem"><label for="nl-note">Note</label><textarea id="nl-note" rows="3" placeholder="What did they say?"></textarea></div>
    <div style="margin-bottom:0.4rem"><label for="nl-assign">Assigned to</label><select id="nl-assign" class="assign-select"></select></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="nl-cancel" type="button">Cancel</button>
      <button class="btn btn-primary btn-sm" id="nl-save" type="button">Add Lead</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app-data.js"></script>
<script src="../js/app-ui.js"></script>
<script>
MC.ready.then(function () {
  var ses = MC.auth.require(["admin","sales"], "../portal/login.html"); if (!ses) return;
  (function(){
    var role = (MC.auth.session()||{}).role || "admin";
    var allow = {
      admin: ["index","leads","customers","jobs","schedule","members","money","partners","proposals","team"],
      sales: ["index","leads","customers","jobs","schedule","proposals"],
      field: ["index","jobs","schedule"]
    }[role] || [];
    document.querySelectorAll(".app-nav a[href$='.html']").forEach(function(a){
      var m = a.getAttribute("href").match(/([a-z-]+)\.html$/);
      if (m && ["index","leads","customers","jobs","schedule","members","money","partners","proposals","team"].indexOf(m[1])>-1 && allow.indexOf(m[1])===-1) a.style.display="none";
    });
  })();
  document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); MC.auth.logout("../portal/login.html"); });

  var STAGES = [
    ["new", "New"], ["contacted", "Contacted"], ["inspection", "Inspection"],
    ["quoted", "Quoted"], ["won", "Won"], ["lost", "Lost"]
  ];

  var board = document.getElementById("board");

  function teamOptions(sel) {
    return "<option value=''>Unassigned</option>" + MC.teamMembers().map(function (m) {
      return "<option value='" + m.id + "'" + (String(m.id) === String(sel) ? " selected" : "") + ">" + m.name + " · " + m.role + "</option>";
    }).join("");
  }

  function render() {
    board.innerHTML = "";
    var leads = MC.list("leads");
    STAGES.forEach(function (s) {
      var stage = s[0], label = s[1];
      var col = document.createElement("div");
      col.className = "kcol"; col.dataset.stage = stage;
      var items = leads.filter(function (l) { return l.stage === stage; });
      col.innerHTML = "<div class='kcol-head'><span>" + label + "</span><span class='count'>" + items.length + "</span></div>";
      items.forEach(function (l) {
        var card = document.createElement("div");
        card.className = "kcard"; card.draggable = true; card.dataset.id = l.id;
        card.style.cursor = "pointer";
        card.innerHTML =
          "<div class='k-name'>" + l.name + "</div>" +
          "<div class='k-meta'>" + (l.phone || "") + (l.phone ? " · " : "") + l.city + "</div>" +
          (l.note ? "<div class='k-meta'>" + l.note + "</div>" : "") +
          (l.assigned_to ? "<div class='k-meta'>→ " + MC.memberName(l.assigned_to) + "</div>" : "") +
          "<div class='k-tags'><span class='badge pine'>" + l.service + "</span><span class='badge gray'>" + MC.fmtDate(l.created) + "</span></div>";
        col.appendChild(card);
      });
      board.appendChild(col);
    });
  }
  render();

  /* Drag & drop */
  var draggedId = null;
  board.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".kcard"); if (!card) return;
    draggedId = card.dataset.id; card.classList.add("dragging");
  });
  board.addEventListener("dragend", function (e) {
    var card = e.target.closest(".kcard"); if (card) card.classList.remove("dragging");
    document.querySelectorAll(".kcol.dragover").forEach(function (c) { c.classList.remove("dragover"); });
  });
  board.addEventListener("dragover", function (e) {
    var col = e.target.closest(".kcol"); if (!col) return;
    e.preventDefault();
    document.querySelectorAll(".kcol.dragover").forEach(function (c) { c.classList.remove("dragover"); });
    col.classList.add("dragover");
  });
  board.addEventListener("drop", function (e) {
    var col = e.target.closest(".kcol"); if (!col || !draggedId) return;
    e.preventDefault();
    var stage = col.dataset.stage;
    MC.update("leads", draggedId, { stage: stage });
    /* Winning a lead promotes them to a customer automatically */
    if (stage === "won") {
      var l = MC.get("leads", draggedId);
      var exists = MC.list("customers").some(function (c) { return c.name === l.name; });
      if (!exists) MC.add("customers", { name: l.name, phone: l.phone || "", email: "", address: "", city: l.city, member: false, notes: "Won lead — " + l.service + ". " + (l.note || "") });
    }
    draggedId = null; render();
  });

  /* ---------- lead detail panel ---------- */
  function stageLabel(stage) {
    for (var i = 0; i < STAGES.length; i++) { if (STAGES[i][0] === stage) return STAGES[i][1]; }
    return stage || "—";
  }

  function openLeadPanel(id) {
    var lead = MC.get("leads", id); if (!lead) return;

    var stageBtns = STAGES.map(function (s) {
      var active = s[0] === lead.stage;
      return "<button type='button' class='btn btn-" + (active ? "primary" : "outline") + " btn-sm' data-stage='" + s[0] + "'" +
        (active ? " disabled" : "") + " style='margin:0 .35rem .35rem 0'>" + MCUI.esc(s[1]) + "</button>";
    }).join("");

    var assignSel = "<select id='lead-assign' class='assign-select'>" + teamOptions(lead.assigned_to) + "</select>";

    var bodyHTML =
      MCUI.section("Details", MCUI.kv([
        ["Phone", lead.phone ? "<a href='tel:" + MCUI.esc(lead.phone) + "'>" + MCUI.esc(lead.phone) + "</a>" : "", "raw"],
        ["City", lead.city],
        ["Service", lead.service],
        ["Stage", stageLabel(lead.stage)],
        ["Assigned to", MC.memberName(lead.assigned_to)],
        ["Created", MC.fmtDate(lead.created)],
        ["Note", lead.note]
      ])) +
      MCUI.section("Move stage", "<div>" + stageBtns + "</div>") +
      MCUI.section("Assigned to", assignSel);

    var actions = [{
      label: "Create proposal →", kind: "primary", onClick: function () {
        var c = MC.add("customers", {
          name: lead.name, phone: lead.phone || "", city: lead.city || "", email: "", address: "",
          assigned_to: lead.assigned_to || "",
          notes: "Converted from lead" + (lead.note ? ": " + lead.note : "")
        });
        MC.update("leads", lead.id, { stage: "won" });
        location.href = "proposals.html?customer=" + encodeURIComponent(c.id) + "&new=1";
      }
    }];
    if (lead.phone) {
      actions.push({ label: "Call", kind: "outline", onClick: function () { location.href = "tel:" + lead.phone; } });
    }

    MCUI.open({
      eyebrow: "Lead",
      title: lead.name,
      subtitle: [lead.service, lead.city].filter(Boolean).join(" · "),
      bodyHTML: bodyHTML,
      actions: actions,
      onBody: function (bodyEl) {
        bodyEl.querySelectorAll("[data-stage]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            MC.update("leads", lead.id, { stage: btn.dataset.stage });
            render();
            openLeadPanel(lead.id);
          });
        });
        var sel = bodyEl.querySelector("#lead-assign");
        if (sel) sel.addEventListener("change", function () {
          MC.update("leads", lead.id, { assigned_to: sel.value || "" });
          render();
          MCUI.toast("Assignment updated");
        });
      }
    });
  }

  board.addEventListener("click", function (e) {
    if (e.target.closest("button, a, select, input")) return;
    var card = e.target.closest(".kcard"); if (!card) return;
    openLeadPanel(card.dataset.id);
  });

  /* New lead modal */
  var modal = document.getElementById("lead-modal");
  document.getElementById("add-lead").addEventListener("click", function () {
    document.getElementById("nl-assign").innerHTML = teamOptions("");
    modal.classList.add("open");
  });
  document.getElementById("nl-cancel").addEventListener("click", function () { modal.classList.remove("open"); });
  document.getElementById("nl-save").addEventListener("click", function () {
    var name = document.getElementById("nl-name").value.trim();
    if (!name) { document.getElementById("nl-name").focus(); return; }
    MC.add("leads", {
      name: name,
      phone: document.getElementById("nl-phone").value.trim(),
      city: document.getElementById("nl-city").value,
      service: document.getElementById("nl-service").value,
      note: document.getElementById("nl-note").value.trim(),
      assigned_to: document.getElementById("nl-assign").value || "",
      stage: "new",
      created: new Date().toISOString().slice(0, 10)
    });
    modal.classList.remove("open");
    ["nl-name", "nl-phone", "nl-note"].forEach(function (id) { document.getElementById(id).value = ""; });
    render();
  });
});
</script>
</body>
</html>
