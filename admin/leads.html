<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leads | Mistletoe CRM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../images/logo-badge.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b3d26">
<meta name="apple-mobile-web-app-title" content="Mistletoe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=3">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="app">
<div class="app-shell">
  <aside class="app-side">
    <a class="brand" href="index.html"><img src="../images/logo-lockup-white.png" alt="Mistletoe Construction"></a>
    <nav class="app-nav" aria-label="CRM">
      <a href="index.html">Dashboard</a>
      <a href="leads.html" aria-current="page">Leads</a>
      <a href="customers.html">Customers</a>
      <a href="proposals.html">Proposals</a>
      <a href="invoices.html">Invoices</a>
      <a href="money.html">Money</a>
      <a href="reviews.html">Reviews</a>
      <a href="jobs.html">Jobs</a>
      <a href="schedule.html">Schedule</a>
      <a href="members.html">Members</a>
      <a href="partners.html">Partners</a>
      <a href="social.html">Social</a>
      <a href="team.html">Team</a>
      <a href="pricing.html">Pricing</a>
      <a href="../index.html" class="nav-sep">← View site</a>
      <a href="#" id="logout">Log out</a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Leads</h1>
        <p class="sub">Drag cards between stages. Won leads become customers.</p>
      </div>
      <button class="btn btn-primary btn-sm" id="add-lead">+ New Lead</button>
    </div>

    <div class="lead-controls" style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
      <input id="lead-search" type="search" placeholder="Search name, city, phone, email…" aria-label="Search leads" style="flex:1;min-width:200px">
      <label class="t-sub" for="lead-sort">Sort</label>
      <select id="lead-sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name">Name A–Z</option>
      </select>
      <select id="lead-owner"><option value="">All owners</option></select>
      <select id="lead-service"><option value="">All services</option></select>
    </div>
    <div class="kanban" id="board"></div>
  </main>
</div>

<div class="modal-back" id="lead-modal">
  <div class="modal">
    <h3>New Lead</h3>
    <div class="form-row">
      <div><label for="nl-name">Name *</label><input id="nl-name" required></div>
      <div><label for="nl-phone">Phone</label><input id="nl-phone" type="tel"></div>
    </div>
    <div style="margin-bottom:0.4rem"><label for="nl-email">Email</label><input id="nl-email" type="email" placeholder="name@email.com"></div>
    <div class="form-row">
      <div><label for="nl-city">Town</label>
        <select id="nl-city"><option>Roseburg</option><option>Riddle</option><option>Myrtle Creek</option><option>Winston</option><option>Sutherlin</option><option>Canyonville</option><option>Green</option><option>Oakland</option><option>Glide</option><option>Camas Valley</option><option>Other</option></select>
      </div>
      <div><label for="nl-service">Service</label>
        <select id="nl-service"><option>Roof Replacement</option><option>Roof Repair</option><option>Moss Removal</option><option>Metal Roofing</option><option>Siding</option><option>Gutter Cleaning</option><option>Gutter Guards</option><option>Decks</option><option>Fences</option><option>Flooring</option><option>Landscaping</option><option>Pool Installation</option><option>General Contracting</option><option>Membership</option></select>
      </div>
    </div>
    <div style="margin-bottom:0.4rem"><label for="nl-note">Note</label><textarea id="nl-note" rows="3" placeholder="What did they say?"></textarea></div>
    <div style="margin-bottom:0.4rem"><label for="nl-assign">Assigned to</label><select id="nl-assign" class="assign-select"></select></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="nl-cancel" type="button">Cancel</button>
      <button class="btn btn-primary btn-sm" id="nl-save" type="button">Add Lead</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app-data.js?v=3"></script>
<script src="../js/app-ui.js?v=3"></script>
<script>
MC.ready.then(function () {
  var ses = MC.auth.require(["admin","sales"], "../portal/login.html"); if (!ses) return;
  (function(){
    var role = (MC.auth.session()||{}).role || "admin";
    var allow = {
      admin: ["index","leads","customers","jobs","schedule","members","money","partners","proposals","invoices","reviews","team"],
      sales: ["index","leads","customers","jobs","schedule","proposals","invoices"],
      field: ["index","jobs","schedule"]
    }[role] || [];
    document.querySelectorAll(".app-nav a[href$='.html']").forEach(function(a){
      var m = a.getAttribute("href").match(/([a-z-]+)\.html$/);
      if (m && ["index","leads","customers","jobs","schedule","members","money","partners","proposals","invoices","reviews","team"].indexOf(m[1])>-1 && allow.indexOf(m[1])===-1) a.style.display="none";
    });
  })();
  document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); MC.auth.logout("../portal/login.html"); });

  var STAGES = [
    ["new", "New"], ["contact_attempted", "Contact Attempted"], ["contacted", "Contacted"],
    ["inspection", "Inspection"], ["proposal_created", "Proposal Created"],
    ["proposal_sent", "Proposal Sent"], ["won", "Won"], ["lost", "Lost"]
  ];
  /* legacy "quoted" leads show under Proposal Created */
  function normStage(s) { return s === "quoted" ? "proposal_created" : s; }

  var board = document.getElementById("board");

  function teamOptions(sel) {
    return "<option value=''>Unassigned</option>" + MC.teamMembers().map(function (m) {
      return "<option value='" + m.id + "'" + (String(m.id) === String(sel) ? " selected" : "") + ">" + m.name + " · " + m.role + "</option>";
    }).join("");
  }

  var searchEl = document.getElementById("lead-search");
  var sortEl = document.getElementById("lead-sort");
  var ownerEl = document.getElementById("lead-owner");
  var serviceEl = document.getElementById("lead-service");
  function fillControls() {
    ownerEl.innerHTML = "<option value=''>All owners</option>" + MC.teamMembers().map(function (m) {
      return "<option value='" + m.id + "'" + (ownerEl.value === String(m.id) ? " selected" : "") + ">" + m.name + "</option>";
    }).join("");
    var svcs = {}; MC.list("leads").forEach(function (l) { if (l.service) svcs[l.service] = 1; });
    var cur = serviceEl.value;
    serviceEl.innerHTML = "<option value=''>All services</option>" + Object.keys(svcs).sort().map(function (s) {
      return "<option value='" + s + "'" + (cur === s ? " selected" : "") + ">" + s + "</option>";
    }).join("");
  }
  function leadMatches(l) {
    var q = (searchEl.value || "").trim().toLowerCase();
    if (q) { var hay = [l.name, l.city, l.phone, l.email, l.service, l.note, l.address].join(" ").toLowerCase(); if (hay.indexOf(q) === -1) return false; }
    if (ownerEl.value && String(l.assigned_to || "") !== ownerEl.value) return false;
    if (serviceEl.value && l.service !== serviceEl.value) return false;
    return true;
  }
  function sortLeads(items) {
    var mode = sortEl.value;
    return items.sort(function (a, b) {
      if (mode === "name") return String(a.name || "").localeCompare(String(b.name || ""));
      var da = String(a.created || ""), db = String(b.created || "");
      return mode === "oldest" ? (da < db ? -1 : da > db ? 1 : 0) : (da < db ? 1 : da > db ? -1 : 0);
    });
  }

  function render() {
    board.innerHTML = "";
    fillControls();
    var leads = MC.list("leads").filter(leadMatches);
    STAGES.forEach(function (s) {
      var stage = s[0], label = s[1];
      var col = document.createElement("div");
      col.className = "kcol"; col.dataset.stage = stage;
      var items = sortLeads(leads.filter(function (l) { return (MC.leadStageFor ? MC.leadStageFor(l) : normStage(l.stage)) === stage; }));
      col.innerHTML = "<div class='kcol-head'><span>" + label + "</span><span class='count'>" + items.length + "</span></div>";
      items.forEach(function (l) {
        var card = document.createElement("div");
        card.className = "kcard"; card.draggable = true; card.dataset.id = l.id;
        card.style.cursor = "pointer";
        var noContact = !l.phone && !l.email;
        card.innerHTML =
          "<div class='k-name'>" + (l.name || MCUI.esc((l.address || "").split(",")[0]) || "New lead") + "</div>" +
          "<div class='k-meta'>" + (l.phone || (noContact ? "📬 No contact yet" : "")) + ((l.phone || noContact) && l.city ? " · " : "") + (l.city || "") + "</div>" +
          (l.address ? "<div class='k-meta'>" + MCUI.esc(l.address) + "</div>" : "") +
          (l.note ? "<div class='k-meta'>" + l.note + "</div>" : "") +
          (l.assigned_to ? "<div class='k-meta'>→ " + MC.memberName(l.assigned_to) + "</div>" : "") +
          "<div class='k-tags'><span class='badge pine' style='white-space:normal;max-width:100%;overflow-wrap:anywhere;text-align:left'>" + l.service + "</span><span class='badge gray'>" + MC.fmtDate(l.created) + "</span></div>";
        col.appendChild(card);
      });
      board.appendChild(col);
    });
  }
  render();
  searchEl.addEventListener("input", render);
  [sortEl, ownerEl, serviceEl].forEach(function (el) { el.addEventListener("change", render); });
  /* Deep-link: leads.html?lead=<id> opens that lead's panel (used by the proposal Timeline). */
  (function () { var lid = new URLSearchParams(location.search).get("lead"); if (lid && MC.get("leads", lid)) openLeadPanel(lid); })();

  /* Drag & drop */
  var draggedId = null;
  board.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".kcard"); if (!card) return;
    draggedId = card.dataset.id; card.classList.add("dragging");
  });
  board.addEventListener("dragend", function (e) {
    var card = e.target.closest(".kcard"); if (card) card.classList.remove("dragging");
    document.querySelectorAll(".kcol.dragover").forEach(function (c) { c.classList.remove("dragover"); });
  });
  board.addEventListener("dragover", function (e) {
    var col = e.target.closest(".kcol"); if (!col) return;
    e.preventDefault();
    document.querySelectorAll(".kcol.dragover").forEach(function (c) { c.classList.remove("dragover"); });
    col.classList.add("dragover");
  });
  board.addEventListener("drop", function (e) {
    var col = e.target.closest(".kcol"); if (!col || !draggedId) return;
    e.preventDefault();
    var stage = col.dataset.stage;
    MC.update("leads", draggedId, { stage: stage });
    /* Winning a lead promotes them to a customer automatically */
    if (stage === "won") {
      var l = MC.get("leads", draggedId);
      var exists = MC.list("customers").some(function (c) { return c.name === l.name; });
      if (!exists) MC.add("customers", { name: l.name, phone: l.phone || "", email: l.email || "", address: l.address || "", city: l.city, member: false, notes: "Won lead — " + l.service + ". " + (l.note || "") });
    }
    draggedId = null; render();
  });

  /* ---------- lead detail panel ---------- */
  function stageLabel(stage) {
    stage = normStage(stage);
    for (var i = 0; i < STAGES.length; i++) { if (STAGES[i][0] === stage) return STAGES[i][1]; }
    return stage || "—";
  }

  function openLeadPanel(id) {
    var lead = MC.get("leads", id); if (!lead) return;

    var derived = MC.leadStageFor ? MC.leadStageFor(lead) : normStage(lead.stage);
    var stageBtns = STAGES.map(function (s) {
      var active = s[0] === derived;   // highlight the ACTUAL (derived) stage, not the manual field
      return "<button type='button' class='btn btn-" + (active ? "primary" : "outline") + " btn-sm' data-stage='" + s[0] + "'" +
        (active ? " disabled" : "") + " style='margin:0 .35rem .35rem 0'>" + MCUI.esc(s[1]) + "</button>";
    }).join("");

    var assignSel = "<select id='lead-assign' class='assign-select'>" + teamOptions(lead.assigned_to) + "</select>";

    var linked = (MC.list("proposals") || []).filter(function (p) { return MC.proposalLinkedToLead && MC.proposalLinkedToLead(p, lead); });
    var propHTML = linked.length ? linked.map(function (p) {
      var m = MC.dealMilestone ? MC.dealMilestone(p) : { label: p.status || "—" };
      return "<div style='display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.4rem 0;border-bottom:1px solid rgba(28,36,29,.08)'>" +
        "<a href='" + location.origin + "/proposal.html?t=" + p.token + "&admin=1' target='_blank' rel='noopener' class='t-strong'>" + MCUI.esc(p.title || "Proposal") + " ↗</a>" +
        "<span style='display:flex;gap:.7rem;align-items:center;white-space:nowrap'>" +
          "<span class='t-sub'>" + MC.money(p.amount) + " · " + MCUI.esc(m.label) + "</span>" +
          "<a class='btn-icon' href='proposals.html?timeline=" + encodeURIComponent(p.id) + "'>Timeline</a>" +
          "<a class='btn-icon' href='proposals.html?edit=" + encodeURIComponent(p.id) + "'>Edit</a>" +
        "</span></div>";
    }).join("") : "<span class='t-sub'>No proposal linked yet. Use “Create proposal →” below, or open a proposal and “Link lead”.</span>";

    var bodyHTML =
      MCUI.section("Details", MCUI.kv([
        ["Phone", lead.phone ? "<a href='tel:" + MCUI.esc(lead.phone) + "'>" + MCUI.esc(lead.phone) + "</a>" : "", "raw"],
        ["Email", lead.email ? "<a href='mailto:" + MCUI.esc(lead.email) + "'>" + MCUI.esc(lead.email) + "</a>" : "", "raw"],
        ["Address", lead.address || ""],
        ["City", lead.city],
        ["Service", lead.service],
        ["Stage", stageLabel(derived) + (derived !== normStage(lead.stage) ? " <span class='t-sub'>(from proposal)</span>" : ""), "raw"],
        ["Assigned to", MC.memberName(lead.assigned_to)],
        ["Follow-up", lead.followup_at ? MC.fmtDate(lead.followup_at) : ""],
        ["Nurture", (!lead.email ? "<span class='t-sub'>needs an email</span>" : (lead.nurture_stop ? "⏸ Paused" : ((Number(lead.nurture_stage) || 0) >= 3 ? "✓ Sequence complete" : "Active · " + (Number(lead.nurture_stage) || 0) + "/3 emails sent"))), "raw"],
        ["Created", MC.fmtDate(lead.created)],
        ["Note", lead.note]
      ])) +
      MCUI.section("Proposals", propHTML) +
      MCUI.section("Move stage", "<div>" + stageBtns + "</div>") +
      MCUI.section("Assigned to", assignSel) +
      MCUI.section("Activity & follow-up", activityHTML(lead));

    var actions = [{
      label: "Create proposal →", kind: "primary", onClick: function () {
        var goTo = function (cid) { location.href = "proposals.html?customer=" + encodeURIComponent(cid) + "&new=1&lead=" + encodeURIComponent(lead.id); };
        // Reuse an existing customer (by email, else name) — never mint a duplicate on repeat clicks.
        var lem = String(lead.email || "").trim().toLowerCase(), lnm = String(lead.name || "").trim().toLowerCase(), existing = null;
        MC.list("customers").forEach(function (x) {
          if (existing) return;
          if (lem && String(x.email || "").trim().toLowerCase() === lem) existing = x;
          else if (!lem && lnm && String(x.name || "").trim().toLowerCase() === lnm) existing = x;
        });
        if (existing) { goTo(existing.id); return; }
        var c = MC.add("customers", {
          name: lead.name, phone: lead.phone || "", city: lead.city || "", email: lead.email || "", address: "",
          assigned_to: lead.assigned_to || "",
          notes: "Converted from lead" + (lead.note ? ": " + lead.note : "")
        });
        // Wait for the customer to persist before navigating (Supabase race).
        if (c && c._saved && typeof c._saved.then === "function") {
          window.MCUI && MCUI.toast("Setting up proposal…");
          c._saved.then(function () { goTo(c.id); }).catch(function () { alert("Couldn't create the customer record — check your connection and try again."); });
        } else { goTo(c.id); }
      }
    }];
    var draftProp = linked.filter(function (p) { return p.status === "draft"; })[0];
    if (draftProp) {
      actions.push({ label: "Send proposal", kind: "primary", onClick: function () {
        var cust = MC.get("customers", draftProp.customerId);
        if (!cust || !String(cust.email || "").trim()) { alert("The customer needs an email first — open Customers → Edit details, add it, then send."); return; }
        fetch("/api/send-proposal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: draftProp.token }) })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) { if (!res.ok) throw new Error((res.d && res.d.error) || "Failed"); MC.update("proposals", draftProp.id, { status: "sent" }); render(); MCUI.toast("Proposal emailed to " + (res.d.email || "the customer") + " ✓"); openLeadPanel(lead.id); })
          .catch(function (e) { alert("Couldn't send the proposal: " + e.message); });
      } });
    }
    actions.push({ label: "Edit lead", kind: "outline", onClick: function () { editLead(lead); } });
    if (lead.phone) {
      actions.push({ label: "Call", kind: "outline", onClick: function () { location.href = "tel:" + lead.phone; } });
      actions.push({ label: "Text", kind: "outline", onClick: function () { location.href = "sms:" + lead.phone; } });
    }
    if (lead.email) {
      actions.push({ label: "Email", kind: "outline", onClick: function () { location.href = "mailto:" + lead.email; } });
      actions.push({ label: (lead.nurture_stop ? "Resume nurture" : "Stop nurture"), kind: "outline", onClick: function () {
        MC.update("leads", lead.id, { nurture_stop: !lead.nurture_stop });
        MCUI.toast(lead.nurture_stop ? "Nurture resumed ✓" : "Nurture paused for this lead");
        openLeadPanel(lead.id);
      } });
    }
    if (((MC.auth.session() || {}).role) === "admin") {
      actions.push({ label: "Delete", kind: "outline", onClick: function (api) {
        if (!window.confirm("Delete this lead? This can't be undone.")) return;
        // Unlink any proposals first so the DB foreign key can't block the delete.
        var linked = MC.list("proposals").filter(function (p) { return String(p.lead_id) === String(lead.id); });
        var waits = linked.map(function (p) { var o = MC.update("proposals", p.id, { lead_id: null }); return (o && o._saved) ? o._saved : Promise.resolve(); });
        Promise.all(waits).then(function () {
          MC.remove("leads", lead.id);
          (api && api.close) ? api.close() : (window.MCUI && MCUI.close());
          render();
          window.MCUI && MCUI.toast("Lead deleted");
        });
      } });
    }

    MCUI.open({
      eyebrow: "Lead",
      title: lead.name || lead.address || "New lead",
      subtitle: [lead.service, lead.city].filter(Boolean).join(" · "),
      bodyHTML: bodyHTML,
      actions: actions,
      onBody: function (bodyEl) {
        bodyEl.querySelectorAll("[data-stage]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            MC.update("leads", lead.id, { stage: btn.dataset.stage });
            render();
            openLeadPanel(lead.id);
          });
        });
        var sel = bodyEl.querySelector("#lead-assign");
        if (sel) sel.addEventListener("change", function () {
          MC.update("leads", lead.id, { assigned_to: sel.value || "" });
          render();
          MCUI.toast("Assignment updated");
        });
        var addBtn = bodyEl.querySelector("#lead-note-add");
        if (addBtn) addBtn.addEventListener("click", function () {
          var inp = bodyEl.querySelector("#lead-note"); var txt = (inp && inp.value || "").trim(); if (!txt) return;
          var cur = Array.isArray(lead.activity) ? lead.activity.slice() : [];
          cur.push({ at: new Date().toISOString(), text: txt });
          MC.update("leads", lead.id, { activity: cur });
          openLeadPanel(lead.id);
        });
        var fuBtn = bodyEl.querySelector("#lead-fu-save");
        if (fuBtn) fuBtn.addEventListener("click", function () {
          var d = bodyEl.querySelector("#lead-fu");
          MC.update("leads", lead.id, { followup_at: (d && d.value) || null });
          render(); MCUI.toast("Follow-up set ✓"); openLeadPanel(lead.id);
        });
      }
    });
  }

  function activityHTML(lead) {
    var acts = Array.isArray(lead.activity) ? lead.activity.slice() : [];
    var list = acts.length ? acts.slice().reverse().map(function (a) {
      return "<div style='padding:.3rem 0;border-bottom:1px solid rgba(28,36,29,.06)'><span class='t-sub'>" + (a.at ? MC.fmtDate(a.at) : "") + " · </span>" + MCUI.esc(a.text || "") + "</div>";
    }).join("") : "<span class='t-sub'>No activity logged yet.</span>";
    return "<div style='display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem'>" +
        "<label class='t-sub' for='lead-fu'>Follow-up</label><input type='date' id='lead-fu' value='" + (lead.followup_at ? String(lead.followup_at).slice(0, 10) : "") + "'>" +
        "<button class='btn-icon' id='lead-fu-save' type='button'>Set</button></div>" +
      "<div id='lead-acts'>" + list + "</div>" +
      "<div style='display:flex;gap:.5rem;margin-top:.5rem'><input id='lead-note' placeholder='Log a call or note…' style='flex:1'><button class='btn btn-outline btn-sm' id='lead-note-add' type='button'>Log</button></div>";
  }

  board.addEventListener("click", function (e) {
    if (e.target.closest("button, a, select, input")) return;
    var card = e.target.closest(".kcard"); if (!card) return;
    openLeadPanel(card.dataset.id);
  });

  /* New lead modal */
  var modal = document.getElementById("lead-modal");
  var editingLeadId = null;
  function resetLeadModal() {
    editingLeadId = null;
    document.querySelector("#lead-modal h3").textContent = "New Lead";
    document.getElementById("nl-save").textContent = "Add Lead";
    ["nl-name", "nl-phone", "nl-email", "nl-note"].forEach(function (id) { document.getElementById(id).value = ""; });
  }
  function editLead(lead) {
    editingLeadId = lead.id;
    document.getElementById("nl-name").value = lead.name || "";
    document.getElementById("nl-phone").value = lead.phone || "";
    document.getElementById("nl-email").value = lead.email || "";
    if (lead.city) document.getElementById("nl-city").value = lead.city;
    if (lead.service) document.getElementById("nl-service").value = lead.service;
    document.getElementById("nl-note").value = lead.note || "";
    document.getElementById("nl-assign").innerHTML = teamOptions(lead.assigned_to || "");
    document.querySelector("#lead-modal h3").textContent = "Edit Lead";
    document.getElementById("nl-save").textContent = "Save Lead";
    (window.MCUI && MCUI.close());
    modal.classList.add("open");
  }
  document.getElementById("add-lead").addEventListener("click", function () {
    resetLeadModal();
    document.getElementById("nl-assign").innerHTML = teamOptions("");
    modal.classList.add("open");
  });
  document.getElementById("nl-cancel").addEventListener("click", function () { modal.classList.remove("open"); resetLeadModal(); });
  document.getElementById("nl-save").addEventListener("click", function () {
    var name = document.getElementById("nl-name").value.trim();
    if (!name) { document.getElementById("nl-name").focus(); return; }
    var fields = {
      name: name,
      phone: document.getElementById("nl-phone").value.trim(),
      email: document.getElementById("nl-email").value.trim(),
      city: document.getElementById("nl-city").value,
      service: document.getElementById("nl-service").value,
      note: document.getElementById("nl-note").value.trim(),
      assigned_to: document.getElementById("nl-assign").value || ""
    };
    if (editingLeadId) {
      MC.update("leads", editingLeadId, fields);
      modal.classList.remove("open"); resetLeadModal(); render();
      window.MCUI && MCUI.toast("Lead saved ✓");
      return;
    }
    fields.stage = "new";
    fields.created = new Date().toISOString().slice(0, 10);
    MC.add("leads", fields);
    modal.classList.remove("open"); resetLeadModal(); render();
  });
});
</script>
</body>
</html>
