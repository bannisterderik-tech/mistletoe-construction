<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers | Mistletoe CRM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../images/logo-badge.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b3d26">
<meta name="apple-mobile-web-app-title" content="Mistletoe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=3">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="app">
<div class="app-shell">
  <aside class="app-side">
    <a class="brand" href="index.html"><img src="../images/logo-lockup-white.png" alt="Mistletoe Construction"></a>
    <nav class="app-nav" aria-label="CRM">
      <a href="index.html">Dashboard</a>
      <a href="leads.html">Leads</a>
      <a href="customers.html" aria-current="page">Customers</a>
      <a href="proposals.html">Proposals</a>
      <a href="invoices.html">Invoices</a>
      <a href="money.html">Money</a>
      <a href="reviews.html">Reviews</a>
      <a href="jobs.html">Jobs</a>
      <a href="schedule.html">Schedule</a>
      <a href="members.html">Members</a>
      <a href="partners.html">Partners</a>
      <a href="social.html">Social</a>
      <a href="team.html">Team</a>
      <a href="pricing.html">Pricing</a>
      <a href="../index.html" class="nav-sep">← View site</a>
      <a href="#" id="logout">Log out</a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Customers</h1>
        <p class="sub">Everyone you've worked for — members, one-off jobs, and won leads.</p>
      </div>
      <button class="btn btn-primary btn-sm" id="add-customer">+ New Customer</button>
    </div>

    <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
      <input id="search" type="search" placeholder="Search name, city, address, phone, email…" aria-label="Search customers" style="flex:1;min-width:220px">
      <label class="t-sub" style="opacity:.7" for="cust-sort">Sort</label>
      <select id="cust-sort">
        <option value="name">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="city">City A–Z</option>
        <option value="member">Members first</option>
      </select>
    </div>

    <div class="panel">
      <div class="panel-body flush tbl-scroll">
        <table class="tbl">
          <thead>
            <tr><th>Name</th><th>City</th><th>Phone</th><th>Member</th><th>Jobs</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="mc-pager" id="pager" hidden></div>
      </div>
    </div>
  </main>
</div>

<!-- Customer detail modal -->
<div class="modal-back" id="view-modal">
  <div class="modal">
    <h3 id="vc-name">Customer</h3>
    <p id="vc-contact" style="margin:0 0 1rem; color:var(--ink-soft); font-size:0.92rem"></p>
    <div style="margin-bottom:1rem">
      <label for="vc-notes">Notes</label>
      <textarea id="vc-notes" rows="3"></textarea>
    </div>
    <div style="margin-bottom:1rem">
      <label for="vc-assign">Assigned to</label>
      <select id="vc-assign" class="assign-select"></select>
    </div>
    <h4 style="margin:0 0 0.4rem">Jobs</h4>
    <div id="vc-jobs" style="margin-bottom:1rem; font-size:0.92rem"></div>
    <h4 style="margin:0 0 0.4rem">Proposals &amp; Invoices</h4>
    <div id="vc-invoices" style="margin-bottom:1rem; font-size:0.92rem"></div>
    <h4 style="margin:0 0 0.4rem">Visits</h4>
    <div id="vc-visits" style="font-size:0.92rem"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="vc-close" type="button">Close</button>
      <button class="btn btn-primary btn-sm" id="vc-save" type="button">Save</button>
    </div>
  </div>
</div>

<!-- New customer modal -->
<div class="modal-back" id="add-modal">
  <div class="modal">
    <h3>New Customer</h3>
    <div class="form-row">
      <div><label for="nc-name">Name *</label><input id="nc-name" required></div>
      <div><label for="nc-phone">Phone</label><input id="nc-phone" type="tel"></div>
    </div>
    <div class="form-row">
      <div><label for="nc-email">Email</label><input id="nc-email" type="email"></div>
      <div><label for="nc-city">Town</label>
        <select id="nc-city"><option>Roseburg</option><option>Riddle</option><option>Myrtle Creek</option><option>Winston</option><option>Sutherlin</option><option>Canyonville</option><option>Green</option><option>Oakland</option><option>Glide</option><option>Camas Valley</option><option>Other</option></select>
      </div>
    </div>
    <div style="margin-bottom:0.9rem"><label for="nc-address">Address</label><input id="nc-address"></div>
    <div style="margin-bottom:0.9rem"><label for="nc-notes">Notes</label><textarea id="nc-notes" rows="2"></textarea></div>
    <div style="margin-bottom:0.9rem"><label for="nc-assign">Assigned to</label><select id="nc-assign" class="assign-select"></select></div>
    <div style="margin-bottom:0.4rem"><label style="display:flex; align-items:center; gap:0.5rem; font-weight:700"><input type="checkbox" id="nc-member" style="width:auto"> Home Care member</label></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="nc-cancel" type="button">Cancel</button>
      <button class="btn btn-primary btn-sm" id="nc-save" type="button">Add Customer</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app-data.js?v=3"></script>
<script src="../js/app-ui.js?v=3"></script>
<script src="../js/app-paginate.js"></script>
<script>
MC.ready.then(function () {
  var ses = MC.auth.require(["admin","sales"], "../portal/login.html"); if (!ses) return;
  (function(){
    var role = (MC.auth.session()||{}).role || "admin";
    var allow = {
      admin: ["index","leads","customers","jobs","schedule","members","money","partners","proposals","invoices","reviews","team"],
      sales: ["index","leads","customers","jobs","schedule","proposals","invoices"],
      field: ["index","jobs","schedule"]
    }[role] || [];
    document.querySelectorAll(".app-nav a[href$='.html']").forEach(function(a){
      var m = a.getAttribute("href").match(/([a-z-]+)\.html$/);
      if (m && ["index","leads","customers","jobs","schedule","members","money","partners","proposals","invoices","reviews","team"].indexOf(m[1])>-1 && allow.indexOf(m[1])===-1) a.style.display="none";
    });
  })();
  document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); MC.auth.logout("../portal/login.html"); });

  var STATUS_BADGE = { paid: "green", approved: "green", sent: "blue", draft: "gray" };
  function statusBadge(status) {
    return "<span class='badge " + (STATUS_BADGE[status] || "gray") + "'>" + status + "</span>";
  }

  var rows = document.getElementById("rows");
  var search = document.getElementById("search");

  function teamOptions(sel) {
    return "<option value=''>Unassigned</option>" + MC.teamMembers().map(function (m) {
      return "<option value='" + m.id + "'" + (String(m.id) === String(sel) ? " selected" : "") + ">" + m.name + " · " + m.role + "</option>";
    }).join("");
  }

  function custRow(c, jobs) {
    var jobCount = jobs.filter(function (j) { return j.customerId === c.id; }).length;
    return "<tr data-id='" + c.id + "' style='cursor:pointer'>" +
      "<td class='t-strong'>" + c.name + "<span class='t-sub'>" + (c.address || "—") + "</span>" +
      (c.assigned_to ? "<span class='t-sub'>→ " + MC.memberName(c.assigned_to) + "</span>" : "") + "</td>" +
      "<td>" + c.city + "</td>" +
      "<td>" + (c.phone || "—") + "</td>" +
      "<td>" + (c.member ? "<span class='badge green'>Member</span>" : "<span class='badge gray'>—</span>") + "</td>" +
      "<td>" + jobCount + "</td>" +
      "<td><button class='btn-icon' data-view='" + c.id + "'>View</button></td></tr>";
  }
  var pager = MCPager({ controls: document.getElementById("pager"), pageSize: 25, onPage: function (slice) {
    var jobs = MC.list("jobs");
    rows.innerHTML = slice.length ? slice.map(function (c) { return custRow(c, jobs); }).join("")
      : "<tr><td colspan='6' style='color:var(--ink-soft)'>No customers match.</td></tr>";
  } });
  var custSort = document.getElementById("cust-sort");
  function render() {
    var q = search.value.trim().toLowerCase();
    var mode = custSort.value;
    var customers = MC.list("customers").filter(function (c) {
      if (!q) return true;
      return ((c.name || "") + " " + (c.city || "") + " " + (c.address || "") + " " + (c.phone || "") + " " + (c.email || "")).toLowerCase().indexOf(q) !== -1;
    });
    customers.sort(function (a, b) {
      if (mode === "name-desc") return String(b.name || "").localeCompare(String(a.name || ""));
      if (mode === "city") return String(a.city || "").localeCompare(String(b.city || ""));
      if (mode === "member") return (b.member ? 1 : 0) - (a.member ? 1 : 0) || String(a.name || "").localeCompare(String(b.name || ""));
      return String(a.name || "").localeCompare(String(b.name || ""));
    });
    pager.set(customers);
  }
  render();
  search.addEventListener("input", function () { pager.first(); render(); });
  custSort.addEventListener("change", function () { pager.first(); render(); });
  /* Deep-link: customers.html?id=<customerId> opens that profile (used by every "View customer →"). */
  (function () { var qid = new URLSearchParams(location.search).get("id"); if (qid) { var c = MC.get("customers", qid); if (c) openProfile(c); } })();

  /* ---------- Click-through profile panel (MCUI) ---------- */
  var payLink = function (rec) {
    var url = rec.hosted_invoice_url || rec.stripe_invoice_url;
    return url ? " <a href='" + MCUI.esc(url) + "' target='_blank' rel='noopener'>Pay &#8599;</a>" : "";
  };
  var statusLabel = function (s) { s = String(s || ""); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; };

  function openProfile(c) {
    if (!c) return;
    var jobs = MC.list("jobs").filter(function (j) { return j.customerId === c.id; });
    var proposals = MC.list("proposals").filter(function (p) { return p.customerId === c.id; });
    var invoices = MC.list("invoices").filter(function (i) { return i.customerId === c.id; });
    var visits = MC.list("visits").filter(function (v) { return v.customerId === c.id; });

    /* Details */
    var detailRows = [
      ["Phone", c.phone ? "<a href='tel:" + MCUI.esc(c.phone) + "'>" + MCUI.esc(c.phone) + "</a>" : "", "raw"],
      ["Email", c.email ? "<a href='mailto:" + MCUI.esc(c.email) + "'>" + MCUI.esc(c.email) + "</a>" : "", "raw"],
      ["Address", c.address || ""],
      ["City", c.city || ""],
      ["Member", c.member ? "Yes" : "No"],
      ["Assigned to", MC.memberName(c.assigned_to)],
      ["Notes", c.notes || ""]
    ];
    if (c.review_requested_at) {
      detailRows.push(["Review", "Requested " + MC.fmtDate(c.review_requested_at) +
        (c.review_click_count ? " · <span class='badge green'>clicked " + c.review_click_count + "×</span>"
          : c.review_opened_at ? " · opened" : ""), "raw"]);
    }
    var details = MCUI.kv(detailRows);

    var editHint = "<span class='t-sub' style='opacity:.7'> · click to edit</span>";
    var pdfBtn = function (href, label) { return "<a class='btn-icon' target='_blank' rel='noopener' href='" + MCUI.esc(href) + "'>" + label + "</a>"; };

    /* Jobs — click to edit */
    var jobsList = MCUI.list(jobs.map(function (j) {
      return { id: j.id, mainRaw: "<a href='#' data-edit='job:" + MCUI.esc(j.id) + "'>" + MCUI.esc(j.title) + "</a>",
        sub: statusLabel(j.status) + (j.start ? " · " + MC.fmtDate(j.start) : ""), right: MC.money(j.value) };
    }), "No jobs yet.");

    /* Proposals — click to edit + PDF / agreement */
    var propList = MCUI.list(proposals.map(function (p) {
      var links = MC.money(p.amount);
      if (p.token) links += "<div style='margin-top:.2rem'>" + pdfBtn("/proposal.html?t=" + p.token, "PDF") + pdfBtn("/contract.html?t=" + p.token, "Agreement") + "</div>";
      return { mainRaw: "<a href='#' data-edit='proposal:" + MCUI.esc(p.id) + "'>" + MCUI.esc(p.title) + "</a>" + (p.agreement_signed_at ? " ✍" : ""),
        sub: statusLabel(p.status), right: MC.money(p.amount), rightRaw: links };
    }), "No proposals yet.");

    /* Invoices & payments — manual invoices (editable) + proposals invoiced/paid (PDF/pay) */
    var payRows = invoices.map(function (i) {
      return { label: i.label, status: i.status, amount: i.amount, rec: i, manual: true };
    }).concat(proposals.filter(function (p) {
      return p.status === "invoiced" || p.status === "paid";
    }).map(function (p) {
      return { label: p.title, status: p.status, amount: p.amount, rec: p, manual: false };
    }));
    var invList = MCUI.list(payRows.map(function (r) {
      var isPaid = String(r.status) === "paid";
      var right = MC.money(r.amount) + (isPaid ? " <span class='badge green'>Paid</span>" : "");
      var main;
      if (r.manual) {
        main = "<a href='#' data-edit='inv:" + MCUI.esc(r.rec.id) + "'>" + MCUI.esc(r.label) + "</a>";
      } else {
        main = MCUI.esc(r.label);
        var pl = "";
        if (r.rec.stripe_invoice_url) pl += pdfBtn(r.rec.stripe_invoice_url, "Pay / view");
        if (r.rec.stripe_invoice_pdf) pl += pdfBtn(r.rec.stripe_invoice_pdf, "Invoice PDF");
        if (pl) right += "<div style='margin-top:.2rem'>" + pl + "</div>";
      }
      return { mainRaw: main, sub: statusLabel(r.status), right: MC.money(r.amount), rightRaw: right };
    }), "No invoices yet.");

    /* Visits — click to edit */
    var visitList = MCUI.list(visits.map(function (v) {
      return { mainRaw: "<a href='#' data-edit='visit:" + MCUI.esc(v.id) + "'>" + MCUI.esc(v.type) + "</a>",
        sub: v.date ? MC.fmtDate(v.date) : "", right: v.summary || "—", rightRaw: MCUI.esc(v.summary || "") };
    }), "No visits logged.");

    var body =
      MCUI.section("Details", details) +
      MCUI.section("Jobs", jobsList, jobs.length) +
      MCUI.section("Proposals", propList, proposals.length) +
      MCUI.section("Invoices & payments", invList, payRows.length) +
      MCUI.section("Visits", visitList, visits.length);

    var today = new Date().toISOString().slice(0, 10);
    var actions = [
      { label: "New proposal →", kind: "primary", onClick: function () {
          location.href = "proposals.html?customer=" + encodeURIComponent(c.id) + "&new=1";
      } },
      { label: "Edit details", kind: "outline", onClick: function () { openRecordForm(c, "customers", c); } },
      { label: "Add job", kind: "outline", onClick: function () {
          var j = MC.add("jobs", { customerId: c.id, title: "New job", status: "scheduled", start: today, value: 0, note: "" });
          openRecordForm(c, "jobs", j);
      } },
      { label: "Add visit", kind: "outline", onClick: function () {
          var v = MC.add("visits", { customerId: c.id, type: "Site visit", date: today, summary: "" });
          openRecordForm(c, "visits", v);
      } },
      { label: "Add invoice", kind: "outline", onClick: function () { openInvoiceForm(c); } },
      { label: (c.review_requested_at ? "Resend review request ★" : "Request review ★"), kind: "outline", onClick: function () {
          if (!c.email) { MCUI.toast("Add an email to this customer first.", "err"); return; }
          if (MC.mode !== "supabase") { MCUI.toast("Review requests need the live database.", "err"); return; }
          if (c.review_requested_at && !window.confirm("Send another review request to " + c.name + "?")) return;
          MCUI.toast("Sending review request…");
          MC.client().auth.getSession().then(function (r) {
            var token = r.data.session && r.data.session.access_token;
            return fetch("/api/review?action=request-customer", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
              body: JSON.stringify({ customerId: c.id, force: !!c.review_requested_at })
            });
          }).then(function (resp) { return resp.json().then(function (d) { return { ok: resp.ok, d: d }; }); })
            .then(function (res) {
              if (!res.ok) throw new Error((res.d && res.d.error) || "Failed to send");
              MC.update("customers", c.id, { review_requested_at: c.review_requested_at || new Date().toISOString() });
              MCUI.toast("Review request sent to " + (res.d.email || c.email) + " ✓");
              openProfile(MC.get("customers", c.id) || c);
            }).catch(function (e) { MCUI.toast("Couldn't send: " + e.message, "err"); });
      } },
      { label: "Referral link 🎁", kind: "outline", onClick: function () {
          var link = location.origin + "/refer.html?ref=" + encodeURIComponent(c.id);
          var share = "Hi " + (c.name ? c.name.split(" ")[0] : "there") + "! If you know a neighbor who needs a roof, send them our way — they get $500 off and you get $250 when it's installed: " + link;
          function done() { MCUI.toast("Referral message copied — text or email it to " + (c.name || "them") + " ✓"); }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(share).then(done).catch(function () { window.prompt("Copy this referral message:", share); });
          } else { window.prompt("Copy this referral message:", share); }
      } },
      { label: (c.member ? "Remove membership" : "Make member"), kind: "outline", onClick: function () {
          MC.update("customers", c.id, { member: !c.member }); render();
          MCUI.toast(c.member ? "Membership removed" : "Marked as member ✓"); openProfile(MC.get("customers", c.id) || c);
      } }
    ];
    if (((MC.auth.session() || {}).role) === "admin") {
      actions.push({ label: "Delete", kind: "outline", onClick: function (api) {
        if (!window.confirm("Delete this customer? This can't be undone.")) return;
        MC.remove("customers", c.id);
        (api && api.close) ? api.close() : (window.MCUI && MCUI.close());
        render();
        window.MCUI && MCUI.toast("customer deleted");
      } });
    }

    MCUI.open({
      eyebrow: "Customer",
      title: c.name,
      subtitle: [c.city, c.member ? "Member" : ""].filter(Boolean).join(" · "),
      bodyHTML: body,
      actions: actions,
      onBody: function (bodyEl) {
        bodyEl.addEventListener("click", function (e) {
          var a = e.target.closest("[data-edit]"); if (!a) return;
          e.preventDefault();
          var parts = String(a.getAttribute("data-edit")).split(":"), type = parts[0], id = parts.slice(1).join(":");
          if (type === "job") openRecordForm(c, "jobs", MC.get("jobs", id));
          else if (type === "visit") openRecordForm(c, "visits", MC.get("visits", id));
          else if (type === "inv") openRecordForm(c, "invoices", MC.get("invoices", id));
          else if (type === "proposal") openRecordForm(c, "proposals", MC.get("proposals", id));
        });
      }
    });
  }

  /* ---------- Inline record editor (jobs / visits / invoices / proposals) ---------- */
  function dOnly(v) { return v ? String(v).slice(0, 10) : ""; }
  var FIELD_DEFS = {
    jobs: [
      { key: "title", label: "Job title" },
      { key: "status", label: "Status", type: "select", options: ["scheduled", "in-progress", "done"] },
      { key: "start", label: "Start date", type: "date" },
      { key: "value", label: "Value ($)", type: "number" },
      { key: "note", label: "Notes", type: "textarea" }
    ],
    visits: [
      { key: "type", label: "Visit type" },
      { key: "date", label: "Date", type: "date" },
      { key: "summary", label: "Summary", type: "textarea" }
    ],
    invoices: [
      { key: "label", label: "Invoice label" },
      { key: "status", label: "Status", type: "select", options: ["draft", "sent", "paid"] },
      { key: "amount", label: "Amount ($)", type: "number" },
      { key: "date", label: "Date", type: "date" }
    ],
    proposals: [
      { key: "title", label: "Proposal title" },
      { key: "status", label: "Status", type: "select", options: ["draft", "sent", "signed", "invoiced", "paid"] },
      { key: "note", label: "Note", type: "textarea" }
    ],
    customers: [
      { key: "name", label: "Name" },
      { key: "phone", label: "Phone", type: "tel" },
      { key: "email", label: "Email", type: "email" },
      { key: "address", label: "Address" },
      { key: "city", label: "City" },
      { key: "notes", label: "Notes", type: "textarea" }
    ]
  };
  var ENTITY_LABEL = { jobs: "Job", visits: "Visit", invoices: "Invoice", proposals: "Proposal", customers: "Customer" };

  function openRecordForm(c, entity, rec) {
    if (!rec) return;
    var defs = FIELD_DEFS[entity];
    var fields = defs.map(function (f) {
      var v = rec[f.key]; if (f.type === "date") v = dOnly(v);
      var inp;
      if (f.type === "textarea") inp = "<textarea id='ed-" + f.key + "' rows='3'>" + MCUI.esc(v == null ? "" : v) + "</textarea>";
      else if (f.type === "select") inp = "<select id='ed-" + f.key + "'>" + f.options.map(function (o) {
        return "<option value='" + MCUI.esc(o) + "'" + (String(o) === String(v) ? " selected" : "") + ">" + statusLabel(o) + "</option>"; }).join("") + "</select>";
      else inp = "<input id='ed-" + f.key + "' type='" + (f.type || "text") + "'" + (f.type === "number" ? " step='0.01'" : "") + " value='" + MCUI.esc(v == null ? "" : v) + "'>";
      return "<div class='mcui-sec'><label for='ed-" + f.key + "' style='font-weight:700;display:block;margin-bottom:.3rem'>" + MCUI.esc(f.label) + "</label>" + inp + "</div>";
    }).join("");

    var links = "";
    if (entity === "proposals" && rec.token) {
      links = "<div class='mcui-sec' style='display:flex;gap:.5rem;flex-wrap:wrap'>" +
        "<a class='btn btn-outline btn-sm' target='_blank' rel='noopener' href='/proposal.html?t=" + rec.token + "'>Proposal PDF</a>" +
        "<a class='btn btn-outline btn-sm' target='_blank' rel='noopener' href='/contract.html?t=" + rec.token + "'>Agreement</a>" +
        (rec.stripe_invoice_pdf ? "<a class='btn btn-outline btn-sm' target='_blank' rel='noopener' href='" + MCUI.esc(rec.stripe_invoice_pdf) + "'>Invoice PDF</a>" : "") +
        "</div><p class='t-sub'>Edit line items on the Proposals page.</p>";
    }

    var canDelete = ((MC.auth.session() || {}).role) === "admin" && entity !== "customers";
    var html = "<div class='mcui-sec'><h4 style='margin-top:0'>Edit " + ENTITY_LABEL[entity] + "</h4></div>" + fields + links +
      "<div style='display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem'>" +
        "<button type='button' class='btn btn-primary btn-sm' id='ed-save'>Save</button>" +
        "<button type='button' class='btn btn-outline btn-sm' id='ed-back'>Back</button>" +
        (canDelete ? "<button type='button' class='btn btn-outline btn-sm' id='ed-del' style='margin-left:auto'>Delete</button>" : "") +
      "</div>";

    MCUI.setBody(html);
    var d = MCUI.drawer;
    d.querySelector("#ed-back").addEventListener("click", function () { openProfile(MC.get("customers", c.id) || c); });
    if (canDelete) d.querySelector("#ed-del").addEventListener("click", function () {
      if (!window.confirm("Delete this " + ENTITY_LABEL[entity].toLowerCase() + "?")) return;
      MC.remove(entity, rec.id); MCUI.toast(ENTITY_LABEL[entity] + " deleted"); openProfile(c); render();
    });
    d.querySelector("#ed-save").addEventListener("click", function () {
      var patch = {};
      defs.forEach(function (f) {
        var el = d.querySelector("#ed-" + f.key); if (!el) return;
        var v = el.value; if (f.type === "number") v = Number(v || 0);
        patch[f.key] = v;
      });
      var btn = d.querySelector("#ed-save"); btn.disabled = true; btn.textContent = "Saving…";
      var res = MC.update(entity, rec.id, patch);
      var done = (res && res._saved) ? res._saved : Promise.resolve(res);
      done.then(function () { MCUI.toast(ENTITY_LABEL[entity] + " saved ✓"); openProfile(MC.get("customers", c.id) || c); render(); })
        .catch(function () { btn.disabled = false; btn.textContent = "Save"; });
    });
  }

  /* ---------- Inline invoice form (swaps drawer body) ---------- */
  function openInvoiceForm(c) {
    // stable per-form id so a double-click can't create two invoices
    var invReqId = "inv-" + c.id + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    function lineRow() {
      return "<div class='inv-line' style='display:grid;grid-template-columns:1fr 4rem 5.5rem 1.6rem;gap:.4rem;margin-bottom:.4rem;align-items:center'>" +
        "<input class='inv-desc' placeholder='Description'>" +
        "<input class='inv-qty' type='number' min='1' value='1' placeholder='Qty'>" +
        "<input class='inv-unit' type='number' min='0' step='0.01' placeholder='Unit $'>" +
        "<button type='button' class='btn-icon inv-del' title='Remove line'>&times;</button>" +
      "</div>";
    }
    var html =
      "<div class='mcui-sec'>" +
        "<label for='inv-title' style='font-weight:700;display:block;margin-bottom:.3rem'>Invoice title</label>" +
        "<input id='inv-title' placeholder='e.g. Roof repair — Cedar St'>" +
      "</div>" +
      "<div class='mcui-sec'>" +
        "<h4>Line items</h4>" +
        "<div id='inv-lines'>" + lineRow() + "</div>" +
        "<button type='button' class='btn btn-outline btn-sm' id='inv-add'>+ Add line</button>" +
        "<div style='margin-top:.8rem;font-weight:800;text-align:right'>Total: <span id='inv-total'>$0</span></div>" +
      "</div>" +
      "<div style='display:flex;gap:.6rem;flex-wrap:wrap'>" +
        "<button type='button' class='btn btn-primary btn-sm' id='inv-send'>Send invoice</button>" +
        "<button type='button' class='btn btn-outline btn-sm' id='inv-back'>Back</button>" +
      "</div>";

    MCUI.setBody(html);
    var drawer = MCUI.drawer;
    var linesEl = drawer.querySelector("#inv-lines");
    var totalEl = drawer.querySelector("#inv-total");

    function collect() {
      var items = [], total = 0;
      drawer.querySelectorAll(".inv-line").forEach(function (row) {
        var desc = row.querySelector(".inv-desc").value.trim();
        var qty = Math.max(1, parseInt(row.querySelector(".inv-qty").value || "1", 10));
        var unit = Number(row.querySelector(".inv-unit").value || 0);
        if (!(unit > 0)) return;
        items.push({ desc: desc || "Roofing / construction service", qty: qty, unit: unit });
        total += unit * qty;
      });
      return { items: items, total: total };
    }
    function refreshTotal() { totalEl.textContent = MC.money(collect().total); }

    linesEl.addEventListener("input", refreshTotal);
    linesEl.addEventListener("click", function (e) {
      var del = e.target.closest(".inv-del"); if (!del) return;
      if (drawer.querySelectorAll(".inv-line").length > 1) del.closest(".inv-line").remove();
      else { del.closest(".inv-line").querySelectorAll("input").forEach(function (i) { i.value = i.classList.contains("inv-qty") ? "1" : ""; }); }
      refreshTotal();
    });
    drawer.querySelector("#inv-add").addEventListener("click", function () {
      linesEl.insertAdjacentHTML("beforeend", lineRow()); refreshTotal();
    });
    drawer.querySelector("#inv-back").addEventListener("click", function () { openProfile(c); });

    drawer.querySelector("#inv-send").addEventListener("click", function () {
      var title = drawer.querySelector("#inv-title").value.trim() || "Invoice";
      var res = collect();
      if (!res.items.length) { MCUI.toast("Add at least one line with a unit price.", "err"); return; }
      var btn = drawer.querySelector("#inv-send");
      btn.disabled = true; btn.textContent = "Sending…";

      if (MC.mode === "supabase") {
        MC.client().auth.getSession().then(function (r) {
          var token = r.data.session && r.data.session.access_token;
          return fetch("/api/create-invoice", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ customerId: c.id, title: title, items: res.items, requestId: invReqId })
          });
        }).then(function (resp) { return resp.json(); }).then(function (data) {
          if (data && data.url) {
            MCUI.toast("Invoice created & emailed ✓");
            window.open(data.url, "_blank");
            openProfile(c);
          } else {
            btn.disabled = false; btn.textContent = "Send invoice";
            MCUI.toast((data && data.error) || "Could not create invoice", "err");
          }
        }).catch(function () {
          btn.disabled = false; btn.textContent = "Send invoice";
          MCUI.toast("Could not create invoice", "err");
        });
      } else {
        MC.add("invoices", {
          customerId: c.id, kind: "invoice", label: title, amount: res.total,
          status: "sent", date: new Date().toISOString().slice(0, 10)
        });
        MCUI.toast("Invoice added (demo)");
        openProfile(c);
      }
    });
  }

  rows.addEventListener("click", function (e) {
    if (e.target.closest("button") || e.target.closest("a")) return;
    var tr = e.target.closest("tr[data-id]"); if (!tr) return;
    openProfile(MC.get("customers", tr.dataset.id));
  });

  /* ---------- View modal ---------- */
  var viewModal = document.getElementById("view-modal");
  var currentId = null;

  rows.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-view]"); if (!btn) return;
    var c = MC.get("customers", btn.dataset.view); if (!c) return;
    currentId = c.id;
    document.getElementById("vc-name").textContent = c.name;
    document.getElementById("vc-contact").innerHTML =
      (c.phone || "No phone") + " · " + (c.email || "No email") + "<br>" +
      (c.address ? c.address + ", " : "") + c.city +
      (c.member ? " &nbsp;<span class='badge green'>Member</span>" : "");
    document.getElementById("vc-notes").value = c.notes || "";
    document.getElementById("vc-assign").innerHTML = teamOptions(c.assigned_to || "");

    var jobs = MC.list("jobs").filter(function (j) { return j.customerId === c.id; });
    document.getElementById("vc-jobs").innerHTML = jobs.length
      ? jobs.map(function (j) {
          return "<div style='padding:0.3rem 0'>" + j.title + " — " + MC.money(j.value) + " <span class='badge " +
            (j.status === "done" ? "green" : j.status === "in-progress" ? "amber" : "blue") + "'>" + j.status + "</span></div>";
        }).join("")
      : "<span style='color:var(--ink-soft)'>No jobs yet.</span>";

    var invoices = MC.list("invoices").filter(function (i) { return i.customerId === c.id; });
    document.getElementById("vc-invoices").innerHTML = invoices.length
      ? invoices.map(function (i) {
          return "<div style='padding:0.3rem 0'>" + i.label + " — " + MC.money(i.amount) + " " + statusBadge(i.status) + "</div>";
        }).join("")
      : "<span style='color:var(--ink-soft)'>None yet.</span>";

    var visits = MC.list("visits").filter(function (v) { return v.customerId === c.id; });
    document.getElementById("vc-visits").innerHTML = visits.length
      ? visits.map(function (v) {
          return "<div style='padding:0.3rem 0'><strong>" + MC.fmtDate(v.date) + "</strong> — " + v.type +
            (v.summary ? "<span class='t-sub'>" + v.summary + "</span>" : "") + "</div>";
        }).join("")
      : "<span style='color:var(--ink-soft)'>No visits recorded.</span>";

    viewModal.classList.add("open");
  });

  document.getElementById("vc-close").addEventListener("click", function () { viewModal.classList.remove("open"); });
  document.getElementById("vc-save").addEventListener("click", function () {
    if (currentId) MC.update("customers", currentId, { notes: document.getElementById("vc-notes").value.trim(), assigned_to: document.getElementById("vc-assign").value || "" });
    viewModal.classList.remove("open");
  });

  /* ---------- New customer modal ---------- */
  var addModal = document.getElementById("add-modal");
  document.getElementById("add-customer").addEventListener("click", function () {
    document.getElementById("nc-assign").innerHTML = teamOptions("");
    addModal.classList.add("open");
  });
  document.getElementById("nc-cancel").addEventListener("click", function () { addModal.classList.remove("open"); });
  document.getElementById("nc-save").addEventListener("click", function () {
    var name = document.getElementById("nc-name").value.trim();
    if (!name) { document.getElementById("nc-name").focus(); return; }
    var btn = this; btn.disabled = true; var label = btn.textContent; btn.textContent = "Saving…";
    var rec = MC.add("customers", {
      name: name,
      phone: document.getElementById("nc-phone").value.trim(),
      email: document.getElementById("nc-email").value.trim(),
      address: document.getElementById("nc-address").value.trim(),
      city: document.getElementById("nc-city").value,
      member: document.getElementById("nc-member").checked,
      notes: document.getElementById("nc-notes").value.trim(),
      assigned_to: document.getElementById("nc-assign").value || ""
    });
    var done = (rec && rec._saved) ? rec._saved : Promise.resolve(rec);
    done.then(function () {
      window.MCUI && MCUI.toast("Customer saved ✓");
      addModal.classList.remove("open");
      ["nc-name", "nc-phone", "nc-email", "nc-address", "nc-notes"].forEach(function (id) { document.getElementById(id).value = ""; });
      document.getElementById("nc-member").checked = false;
    }).catch(function () { /* data layer already toasted the reason; keep the form open to retry */ })
      .then(function () { btn.disabled = false; btn.textContent = label; render(); });
  });
});
</script>
</body>
</html>
