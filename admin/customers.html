<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers | Mistletoe CRM</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../images/logo-badge.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b3d26">
<meta name="apple-mobile-web-app-title" content="Mistletoe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=3">
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="app">
<div class="app-shell">
  <aside class="app-side">
    <a class="brand" href="index.html"><img src="../images/logo-lockup-white.png" alt="Mistletoe Construction"></a>
    <nav class="app-nav" aria-label="CRM">
      <a href="index.html">Dashboard</a>
      <a href="leads.html">Leads</a>
      <a href="customers.html" aria-current="page">Customers</a>
      <a href="jobs.html">Jobs</a>
      <a href="schedule.html">Schedule</a>
      <a href="members.html">Members</a>
      <a href="money.html">Money</a>
      <a href="partners.html">Partners</a>
      <a href="proposals.html">Proposals</a>
      <a href="team.html">Team</a>
      <a href="../index.html" class="nav-sep">← View site</a>
      <a href="#" id="logout">Log out</a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Customers</h1>
        <p class="sub">Everyone you've worked for — members, one-off jobs, and won leads.</p>
      </div>
      <button class="btn btn-primary btn-sm" id="add-customer">+ New Customer</button>
    </div>

    <div style="margin-bottom:1rem; max-width:24rem">
      <input id="search" type="search" placeholder="Search name, city, or address…" aria-label="Search customers">
    </div>

    <div class="panel">
      <div class="panel-body flush tbl-scroll">
        <table class="tbl">
          <thead>
            <tr><th>Name</th><th>City</th><th>Phone</th><th>Member</th><th>Jobs</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Customer detail modal -->
<div class="modal-back" id="view-modal">
  <div class="modal">
    <h3 id="vc-name">Customer</h3>
    <p id="vc-contact" style="margin:0 0 1rem; color:var(--ink-soft); font-size:0.92rem"></p>
    <div style="margin-bottom:1rem">
      <label for="vc-notes">Notes</label>
      <textarea id="vc-notes" rows="3"></textarea>
    </div>
    <div style="margin-bottom:1rem">
      <label for="vc-assign">Assigned to</label>
      <select id="vc-assign" class="assign-select"></select>
    </div>
    <h4 style="margin:0 0 0.4rem">Jobs</h4>
    <div id="vc-jobs" style="margin-bottom:1rem; font-size:0.92rem"></div>
    <h4 style="margin:0 0 0.4rem">Estimates &amp; Invoices</h4>
    <div id="vc-invoices" style="margin-bottom:1rem; font-size:0.92rem"></div>
    <h4 style="margin:0 0 0.4rem">Visits</h4>
    <div id="vc-visits" style="font-size:0.92rem"></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="vc-close" type="button">Close</button>
      <button class="btn btn-primary btn-sm" id="vc-save" type="button">Save</button>
    </div>
  </div>
</div>

<!-- New customer modal -->
<div class="modal-back" id="add-modal">
  <div class="modal">
    <h3>New Customer</h3>
    <div class="form-row">
      <div><label for="nc-name">Name *</label><input id="nc-name" required></div>
      <div><label for="nc-phone">Phone</label><input id="nc-phone" type="tel"></div>
    </div>
    <div class="form-row">
      <div><label for="nc-email">Email</label><input id="nc-email" type="email"></div>
      <div><label for="nc-city">Town</label>
        <select id="nc-city"><option>Roseburg</option><option>Riddle</option><option>Myrtle Creek</option><option>Winston</option><option>Sutherlin</option><option>Canyonville</option><option>Green</option><option>Oakland</option><option>Glide</option><option>Camas Valley</option><option>Other</option></select>
      </div>
    </div>
    <div style="margin-bottom:0.9rem"><label for="nc-address">Address</label><input id="nc-address"></div>
    <div style="margin-bottom:0.9rem"><label for="nc-notes">Notes</label><textarea id="nc-notes" rows="2"></textarea></div>
    <div style="margin-bottom:0.9rem"><label for="nc-assign">Assigned to</label><select id="nc-assign" class="assign-select"></select></div>
    <div style="margin-bottom:0.4rem"><label style="display:flex; align-items:center; gap:0.5rem; font-weight:700"><input type="checkbox" id="nc-member" style="width:auto"> Home Care member</label></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="nc-cancel" type="button">Cancel</button>
      <button class="btn btn-primary btn-sm" id="nc-save" type="button">Add Customer</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/app-data.js"></script>
<script src="../js/app-ui.js"></script>
<script>
MC.ready.then(function () {
  var ses = MC.auth.require(["admin","sales"], "../portal/login.html"); if (!ses) return;
  (function(){
    var role = (MC.auth.session()||{}).role || "admin";
    var allow = {
      admin: ["index","leads","customers","jobs","schedule","members","money","partners","proposals","team"],
      sales: ["index","leads","customers","jobs","schedule","proposals"],
      field: ["index","jobs","schedule"]
    }[role] || [];
    document.querySelectorAll(".app-nav a[href$='.html']").forEach(function(a){
      var m = a.getAttribute("href").match(/([a-z-]+)\.html$/);
      if (m && ["index","leads","customers","jobs","schedule","members","money","partners","proposals","team"].indexOf(m[1])>-1 && allow.indexOf(m[1])===-1) a.style.display="none";
    });
  })();
  document.getElementById("logout").addEventListener("click", function (e) { e.preventDefault(); MC.auth.logout("../portal/login.html"); });

  var STATUS_BADGE = { paid: "green", approved: "green", sent: "blue", draft: "gray" };
  function statusBadge(status) {
    return "<span class='badge " + (STATUS_BADGE[status] || "gray") + "'>" + status + "</span>";
  }

  var rows = document.getElementById("rows");
  var search = document.getElementById("search");

  function teamOptions(sel) {
    return "<option value=''>Unassigned</option>" + MC.teamMembers().map(function (m) {
      return "<option value='" + m.id + "'" + (String(m.id) === String(sel) ? " selected" : "") + ">" + m.name + " · " + m.role + "</option>";
    }).join("");
  }

  function render() {
    var q = search.value.trim().toLowerCase();
    var jobs = MC.list("jobs");
    var customers = MC.list("customers").filter(function (c) {
      if (!q) return true;
      return (c.name + " " + c.city + " " + c.address).toLowerCase().indexOf(q) !== -1;
    });
    rows.innerHTML = "";
    customers.forEach(function (c) {
      var jobCount = jobs.filter(function (j) { return j.customerId === c.id; }).length;
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td class='t-strong'>" + c.name + "<span class='t-sub'>" + (c.address || "—") + "</span>" +
        (c.assigned_to ? "<span class='t-sub'>→ " + MC.memberName(c.assigned_to) + "</span>" : "") + "</td>" +
        "<td>" + c.city + "</td>" +
        "<td>" + (c.phone || "—") + "</td>" +
        "<td>" + (c.member ? "<span class='badge green'>Member</span>" : "<span class='badge gray'>—</span>") + "</td>" +
        "<td>" + jobCount + "</td>" +
        "<td><button class='btn-icon' data-view='" + c.id + "'>View</button></td>";
      rows.appendChild(tr);
    });
    if (!customers.length) {
      rows.innerHTML = "<tr><td colspan='6' style='color:var(--ink-soft)'>No customers match.</td></tr>";
    }
  }
  render();
  search.addEventListener("input", render);

  /* ---------- View modal ---------- */
  var viewModal = document.getElementById("view-modal");
  var currentId = null;

  rows.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-view]"); if (!btn) return;
    var c = MC.get("customers", btn.dataset.view); if (!c) return;
    currentId = c.id;
    document.getElementById("vc-name").textContent = c.name;
    document.getElementById("vc-contact").innerHTML =
      (c.phone || "No phone") + " · " + (c.email || "No email") + "<br>" +
      (c.address ? c.address + ", " : "") + c.city +
      (c.member ? " &nbsp;<span class='badge green'>Member</span>" : "");
    document.getElementById("vc-notes").value = c.notes || "";
    document.getElementById("vc-assign").innerHTML = teamOptions(c.assigned_to || "");

    var jobs = MC.list("jobs").filter(function (j) { return j.customerId === c.id; });
    document.getElementById("vc-jobs").innerHTML = jobs.length
      ? jobs.map(function (j) {
          return "<div style='padding:0.3rem 0'>" + j.title + " — " + MC.money(j.value) + " <span class='badge " +
            (j.status === "done" ? "green" : j.status === "in-progress" ? "amber" : "blue") + "'>" + j.status + "</span></div>";
        }).join("")
      : "<span style='color:var(--ink-soft)'>No jobs yet.</span>";

    var invoices = MC.list("invoices").filter(function (i) { return i.customerId === c.id; });
    document.getElementById("vc-invoices").innerHTML = invoices.length
      ? invoices.map(function (i) {
          return "<div style='padding:0.3rem 0'>" + i.label + " — " + MC.money(i.amount) + " " + statusBadge(i.status) + "</div>";
        }).join("")
      : "<span style='color:var(--ink-soft)'>None yet.</span>";

    var visits = MC.list("visits").filter(function (v) { return v.customerId === c.id; });
    document.getElementById("vc-visits").innerHTML = visits.length
      ? visits.map(function (v) {
          return "<div style='padding:0.3rem 0'><strong>" + MC.fmtDate(v.date) + "</strong> — " + v.type +
            (v.summary ? "<span class='t-sub'>" + v.summary + "</span>" : "") + "</div>";
        }).join("")
      : "<span style='color:var(--ink-soft)'>No visits recorded.</span>";

    viewModal.classList.add("open");
  });

  document.getElementById("vc-close").addEventListener("click", function () { viewModal.classList.remove("open"); });
  document.getElementById("vc-save").addEventListener("click", function () {
    if (currentId) MC.update("customers", currentId, { notes: document.getElementById("vc-notes").value.trim(), assigned_to: document.getElementById("vc-assign").value || "" });
    viewModal.classList.remove("open");
  });

  /* ---------- New customer modal ---------- */
  var addModal = document.getElementById("add-modal");
  document.getElementById("add-customer").addEventListener("click", function () {
    document.getElementById("nc-assign").innerHTML = teamOptions("");
    addModal.classList.add("open");
  });
  document.getElementById("nc-cancel").addEventListener("click", function () { addModal.classList.remove("open"); });
  document.getElementById("nc-save").addEventListener("click", function () {
    var name = document.getElementById("nc-name").value.trim();
    if (!name) { document.getElementById("nc-name").focus(); return; }
    MC.add("customers", {
      name: name,
      phone: document.getElementById("nc-phone").value.trim(),
      email: document.getElementById("nc-email").value.trim(),
      address: document.getElementById("nc-address").value.trim(),
      city: document.getElementById("nc-city").value,
      member: document.getElementById("nc-member").checked,
      notes: document.getElementById("nc-notes").value.trim(),
      assigned_to: document.getElementById("nc-assign").value || ""
    });
    addModal.classList.remove("open");
    ["nc-name", "nc-phone", "nc-email", "nc-address", "nc-notes"].forEach(function (id) { document.getElementById(id).value = ""; });
    document.getElementById("nc-member").checked = false;
    render();
  });
});
</script>
</body>
</html>
