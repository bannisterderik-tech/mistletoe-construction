<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In | Mistletoe Construction</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../images/logo-badge.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b3d26">
<meta name="apple-mobile-web-app-title" content="Mistletoe">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css?v=3">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="rain" aria-hidden="true"></div>
  <div class="login-card">
    <img class="brand-badge" src="../images/logo-badge.webp" alt="Mistletoe Construction LLC">
    <h1 style="text-align:center;font-size:1.5rem">Welcome back.</h1>
    <p style="text-align:center;color:var(--ink-soft);font-size:0.95rem;margin-top:-0.4rem">Sign in to your Mistletoe account.</p>

    <div class="login-tabs" role="tablist">
      <button type="button" class="active" data-role="client">Homeowner</button>
      <button type="button" data-role="admin">Team</button>
    </div>

    <form id="login-form">
      <div style="margin-bottom:0.9rem">
        <label for="lg-email">Email</label>
        <input id="lg-email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Email Me a Sign-In Link</button>
      <p class="login-note">No passwords to remember — we email you a secure one-tap link.</p>
    </form>

    <p class="login-note">New here? The same box works — your account is created on first sign-in.</p>
    <p class="login-note"><a href="../index.html">← Back to mistletoeconstruction.com</a></p>
  </div>
</div>

<script src="../js/main.js" defer></script>
<script src="../js/config.js"></script>
<script src="../js/app-data.js"></script>
<script>
MC.ready.then(function () {
  var role = "client";
  var tabs = document.querySelectorAll(".login-tabs button");
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      tabs.forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active"); role = b.dataset.role;
    });
  });

  function routeBySession(s) {
    var staff = s.role === "admin" || s.role === "sales" || s.role === "field";
    location.href = staff ? "../admin/index.html" : "index.html";
  }

  if (MC.mode === "supabase") {
    /* Already signed in (e.g. returning from the magic link)? Go straight in. */
    var s = MC.auth.session();
    if (s) { routeBySession(s); return; }

    var notes = document.querySelectorAll(".login-note");

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("lg-email").value.trim();
      if (!email) return;
      var btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "Sending…";
      MC.auth.sendMagicLink(email, location.href).then(function (r) {
        if (r.error) {
          btn.disabled = false; btn.textContent = "Email Me a Sign-In Link";
          alert("Couldn't send the link: " + r.error.message);
        } else {
          btn.textContent = "Check your email ✓";
          if (notes[0]) notes[0].textContent = "We sent a sign-in link to " + email + ". Open it on this device.";
        }
      });
    });
  } else {
    function go() {
      MC.auth.login(role);
      location.href = role === "admin" ? "../admin/index.html" : "index.html";
    }
    document.getElementById("login-form").addEventListener("submit", function (e) { e.preventDefault(); go(); });
  }
});
</script>
</body>
</html>
